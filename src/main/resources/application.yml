server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false 
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: always